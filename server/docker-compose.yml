version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pos_local_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_local_network
      POSTGRES_USER: pos_local_network
      POSTGRES_PASSWORD: pos_local_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_local_network -d pos_local_network"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
